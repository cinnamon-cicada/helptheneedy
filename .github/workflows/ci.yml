name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime
      - run: npm test
      - run: npx supabase db lint --schema public,private --level warning --fail-on error
